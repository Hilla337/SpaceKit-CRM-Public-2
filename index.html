<!doctype html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpaceKit CRM">
<title>SpaceKit CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #F4EFE7;
  --surface: #FFFDF9;
  --surface-2: #FAF6EF;
  --line: #E3DACB;
  --text: #1E1D1B;
  --muted: #80776B;
  --blue: #7FA7D1;
  --blue-strong: #3F6E9C;
  --blue-soft: #E1ECF7;
  --blue-softer: #EEF4FA;
  --beige-deep: #E5DED1;
  --green: #3E8A5E;
  --green-soft: #E3F1E7;
  --red: #BE5139;
  --red-soft: #F7E3DC;
  --amber: #B98222;
  --amber-soft: #F6EBD5;
  --orange: #D9732E;
  --orange-strong: #C2611F;
  --orange-soft: #FBE9DA;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 3px 10px rgba(60, 45, 20, .04);
  --nav-h: 66px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.4 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue-strong); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* boot / gate */
.boot, .gate { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px; text-align: center; }
.boot-logo { width: 190px; opacity: .92; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--beige-deep); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.gate h1 { font-size: 21px; margin: 0; }
.gate p { margin: 0; color: var(--muted); max-width: 320px; }
.gate code { background: var(--surface); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 16px; user-select: all; }

/* layout */
.main { padding: 12px 16px calc(var(--nav-h) + 92px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; }
.topbar .logo { height: 26px; }
.topbar .title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; flex: 1; }
.topbar .spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
.home-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 10px 0 6px; }
.home-logo { height: 54px; max-width: 100%; justify-self: center; object-fit: contain; }
.icon-ph { width: 40px; height: 40px; }
.hello { color: #4A443C; font-size: 15px; font-weight: 700; margin: 4px 0 16px; text-align: center; letter-spacing: .01em; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; }
.section-title h2 { font-size: 13px; margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: #4A443C; }
.section-title h2::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--orange); border-radius: 2px; margin-right: 8px; vertical-align: 1px; }
.section-title button { border: 0; background: none; color: var(--orange-strong); font-weight: 700; cursor: pointer; padding: 0; font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card + .card { margin-top: 10px; }
.hero { background: var(--surface); padding: 18px 18px 16px 20px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--orange); }
.hero .label, .kpi .label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero .value { font-size: 31px; font-weight: 800; letter-spacing: -.025em; margin: 6px 0 2px; }
.hero .sub, .kpi .sub { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.kpi { padding: 14px; }
.kpi .value { font-size: 19px; font-weight: 800; margin: 6px 0 3px; letter-spacing: -.01em; }
.neg { color: var(--red); }
.pos { color: var(--green); }
.up { color: var(--green); font-weight: 700; }
.down { color: var(--red); font-weight: 700; }

.banner { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--amber-soft); color: #7A5512; font-weight: 600; margin-top: 12px; cursor: pointer; border: 1px solid #EDDAB4; }
.banner.ok { background: var(--green-soft); color: #2E6B47; border-color: #CDE5D5; cursor: default; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.quick button { border: 1px solid #CFE0F1; background: var(--blue-soft); color: var(--blue-strong); border-radius: 10px; padding: 12px 6px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.quick button:first-child { background: var(--orange); border-color: var(--orange); color: #fff; }

/* lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--surface-2); }
.row .ico { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 15px; }
.ico.in { background: var(--green-soft); color: var(--green); }
.ico.out { background: var(--red-soft); color: var(--red); }
.ico.mv { background: var(--blue-soft); color: var(--blue-strong); }
.ico.neutral { background: var(--beige-deep); color: #5A5247; }
.row .body { flex: 1; min-width: 0; }
.row .t1 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t2 { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-weight: 800; white-space: nowrap; text-align: right; }
.row .amt small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.day { padding: 10px 14px 6px; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.more { width: 100%; padding: 14px; border: 0; background: var(--surface-2); color: var(--blue-strong); font-weight: 700; cursor: pointer; }

.tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .03em; background: var(--beige-deep); color: #5A5247; vertical-align: middle; }
.tag.warn { background: var(--amber-soft); color: #7A5512; }
.tag.s-new { background: var(--orange-soft); color: var(--orange-strong); }
.tag.s-bought { background: #EDE5F7; color: #6A4C93; }
.tag.s-way { background: var(--amber-soft); color: #7A5512; }
.tag.s-done { background: var(--green-soft); color: var(--green); }
.tag.s-cancel { background: #EEE9E2; color: #8B8378; }

/* filters */
.seg { display: flex; background: var(--beige-deep); border-radius: 11px; padding: 3px; gap: 3px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 8px; font-weight: 700; font-size: 13.5px; color: #5A5247; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--blue-soft); border-color: #C6DAEE; color: var(--blue-strong); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; margin-bottom: 8px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; border: 0; background: transparent; padding: 12px 0; outline: none; min-width: 0; }
.totals { display: flex; gap: 8px; margin: 4px 0 12px; }
.totals div { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.totals small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.totals b { font-size: 16px; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255, 253, 249, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
.nav-inner { display: flex; width: 100%; max-width: 640px; }
.nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 12px; }
.nav button svg { width: 23px; height: 23px; }
.nav button.on { color: var(--text); }
.nav button.on .pill { background: var(--orange-soft); color: var(--orange-strong); }
.nav .pill { padding: 3px 14px; border-radius: 999px; display: grid; place-items: center; }
.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); z-index: 21; width: 56px; height: 56px; border-radius: 14px; border: 0; background: var(--orange); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(194, 97, 31, .32); cursor: pointer; }
.fab svg { width: 26px; height: 26px; }

/* sheet */
.overlay { position: fixed; inset: 0; background: rgba(40, 32, 20, .35); z-index: 40; opacity: 0; transition: opacity .2s; }
.overlay.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); max-width: 640px; margin: 0 auto; }
.sheet.show { transform: translateY(0); }
.sheet .grab { width: 40px; height: 5px; background: var(--beige-deep); border-radius: 3px; margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 14px; font-size: 20px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h3 .x { border: 0; background: var(--beige-deep); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex: none; font-size: 18px; line-height: 1; }

/* forms */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 0 2px 6px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; outline: none; font-size: 16px; }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-softer); }
.field .amount { font-size: 26px; font-weight: 800; padding: 10px 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { width: 100%; border: 0; border-radius: 11px; padding: 15px; font-weight: 800; font-size: 16px; cursor: pointer; background: var(--blue-strong); color: #fff; }
.btn:disabled { opacity: .55; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--red-soft); color: var(--red); }
.btn + .btn { margin-top: 8px; }
.hint { font-size: 12.5px; color: var(--muted); margin: -4px 2px 12px; }
.err { color: var(--red); font-weight: 600; font-size: 13.5px; margin: 0 2px 10px; }

.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; word-break: break-word; }
.detail-amt { font-size: 30px; font-weight: 800; margin: 2px 0 14px; }
.status-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.status-btns button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
.status-btns button.on { background: var(--orange); color: #fff; border-color: var(--orange); }
.contact { display: flex; flex-direction: column; gap: 4px; }
.contact a.tel { font-weight: 700; }
.pbar { height: 6px; background: var(--beige-deep); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.pbar i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.suggest { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: -6px 0 12px; overflow: hidden; }
.suggest div { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
.suggest div:last-child { border-bottom: 0; }
.suggest small { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 90px); transform: translateX(-50%) translateY(20px); background: #2B2925; color: #fff; padding: 11px 16px; border-radius: 14px; font-weight: 600; z-index: 60; opacity: 0; transition: all .25s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.skeleton { height: 18px; border-radius: 8px; background: linear-gradient(90deg, var(--beige-deep), #EFE9DF, var(--beige-deep)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.stale { font-size: 12px; color: var(--muted); text-align: center; margin: 2px 0 10px; }

/* ===== v3: строгая светлая тема — плотнее, один акцент ===== */
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --surface-2: #F7F8FA; --line: #E4E6EA;
  --text: #16181D; --muted: #6B7280; --beige-deep: #ECEEF1;
  --orange: #E2671B; --orange-strong: #C4560F; --orange-soft: #FDEEE4;
  --green: #1F8A4C; --green-soft: #E7F5EC; --red: #D23F2E; --red-soft: #FCEBE8;
  --blue: #9AA3AF; --blue-strong: #16181D; --blue-soft: #F1F2F4; --blue-softer: #F1F2F4;
  --radius: 10px; --shadow: none;
}
body { font-size: 14px; }
a { color: var(--orange-strong); }
.main { padding-top: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; }
.icon-btn svg { width: 17px; height: 17px; }
.home-head { display: flex; align-items: center; gap: 6px; padding: 6px 0 2px; }
.home-head .home-logo { order: -1; height: 40px; margin-right: auto; justify-self: auto; }
.home-head .icon-ph { display: none; }
.hello { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); margin: 2px 0 12px; }
.topbar .title { font-size: 20px; }
.section-title { margin: 18px 2px 8px; }
.section-title h2 { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.section-title h2::before { display: none; }
.section-title button { font-size: 13px; font-weight: 600; }
.card { padding: 12px 14px; }
.grid2 { gap: 8px; margin-top: 8px; }
.grid2 > .card { margin-top: 0; }
.hero { padding: 14px; }
.hero::before { display: none; }
.hero .label, .kpi .label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
.hero .value { font-size: 26px; margin: 4px 0 2px; }
.hero .sub, .kpi .sub { font-size: 12px; }
.kpi { padding: 10px 12px; }
.kpi .value { font-size: 17px; margin: 3px 0 2px; }
.banner { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-top: 8px; }
.banner.ok { background: transparent; border-color: transparent; color: var(--green); padding: 6px 2px; font-weight: 600; }
.quick { gap: 6px; margin-top: 8px; }
.quick button { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 6px; font-weight: 600; font-size: 13px; }
.row { padding: 9px 12px; gap: 10px; }
.row .ico { width: 30px; height: 30px; border-radius: 7px; font-size: 14px; }
.ico.mv { background: var(--blue-soft); color: #4B5563; }
.ico.neutral { background: var(--beige-deep); color: #4B5563; }
.row .t1 { font-weight: 600; }
.row .t2 { font-size: 12px; }
.row .amt { font-weight: 700; }
.row .amt small { font-weight: 500; font-size: 11px; }
.day { padding: 7px 12px 5px; font-size: 11px; font-weight: 700; }
.empty { padding: 18px 14px; font-size: 13px; }
.more { padding: 11px; color: var(--text); font-weight: 600; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.seg { border-radius: 9px; padding: 2px; gap: 2px; margin-bottom: 8px; }
.seg button { padding: 7px 6px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chips { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); padding-right: 24px; }
.chip { padding: 5px 10px; border-radius: 6px; font-weight: 500; font-size: 12.5px; }
.chip.on { background: var(--text); border-color: var(--text); color: #fff; }
.search { border-radius: 8px; }
.search input { padding: 9px 0; }
.totals { gap: 6px; margin: 2px 0 10px; }
.totals div { border-radius: 8px; padding: 8px 10px; }
.totals small { font-size: 10.5px; }
.totals b { font-size: 15px; }
.nav { background: rgba(255, 255, 255, .96); padding-top: 4px; }
.nav button { font-size: 10.5px; font-weight: 600; padding: 4px 2px; }
.nav button svg { width: 21px; height: 21px; }
.nav button.on, .nav button.on .pill { color: var(--orange-strong); background: transparent; }
.nav .pill { padding: 2px 10px; }
.fab { width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0, 0, 0, .18); }
.fab svg { width: 22px; height: 22px; }
.overlay { background: rgba(16, 18, 24, .4); }
.sheet { border-radius: 12px 12px 0 0; }
.sheet h3 { font-size: 18px; }
.field input, .field select, .field textarea { border-radius: 8px; padding: 10px 12px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.field .amount { font-size: 22px; }
.btn { border-radius: 9px; padding: 12px; font-weight: 700; font-size: 15px; background: var(--orange); }
.btn.ghost { background: var(--surface); }
.detail-amt { font-size: 26px; }
.status-btns button { border-radius: 6px; padding: 6px 10px; font-weight: 600; }
.toast { border-radius: 10px; background: #16181D; }
.skeleton { background: linear-gradient(90deg, #ECEEF1, #F5F6F8, #ECEEF1); background-size: 200% 100%; }

/* отчёт ДДС */
.rp-open-btn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px; cursor: pointer; color: var(--text); }
.rp-open-btn svg { width: 22px; height: 22px; color: var(--orange); flex: none; }
.rp-open-btn span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rp-open-btn b { font-size: 14px; }
.rp-open-btn small { color: var(--muted); font-size: 12px; }
.rp-open-btn i { font-style: normal; font-size: 22px; color: var(--muted); line-height: 1; }
.rp-open-btn:active { background: var(--surface-2); }
.rp-presets { margin-bottom: 6px; }
.rp-dates { display: flex; gap: 6px; margin-bottom: 8px; }
.rp-dates label { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; color: var(--muted); font-size: 12.5px; }
.rp-dates input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; font-size: 14px; color: var(--text); outline: none; }
.rp-dim { color: var(--muted); font-weight: 500; }
.section-title > .rp-dim { font-size: 12.5px; font-weight: 600; }
.rp-chart-card { padding: 10px 12px 8px; }
.rp-chart { width: 100%; height: 140px; display: block; }
.rp-lbls { position: relative; height: 16px; margin-top: 4px; }
.rp-lbls span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.rp-axis { stroke: var(--line); stroke-width: 1; }
.rp-in { fill: var(--green); }
.rp-out { fill: var(--red); opacity: .85; }
.rp-legend { display: flex; gap: 14px; font-size: 12px; margin-bottom: 6px; align-items: center; }
.rp-legend .rp-dim { margin-left: auto; }
.rp-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.rp-dot.in { background: var(--green); } .rp-dot.out { background: var(--red); }
.rp-bar { height: 4px; background: var(--beige-deep); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.rp-bar i { display: block; height: 100%; border-radius: 2px; }
.rp-bar i.in { background: var(--green); } .rp-bar i.out { background: var(--orange); }
.rp-open { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 6px 12px 8px; }
.rp-subs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); padding: 2px 0 6px; }
.rp-subs b { color: var(--text); font-weight: 600; }
.rp-op { display: flex; gap: 10px; font-size: 12.5px; padding: 5px 0; border-top: 1px dashed var(--line); cursor: pointer; align-items: baseline; }
.rp-op-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-op b { font-weight: 600; white-space: nowrap; }
.rp-more { font-size: 12px; padding-top: 4px; }
.rp-tbl { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; align-items: center; }
.rp-tbl:last-child { border-bottom: 0; }
.rp-tbl span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rp-tbl > :not(:first-child) { text-align: right; white-space: nowrap; }
.rp-th { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); }
.rp-th span:first-child { font-weight: 700; }

/* подсказки вместо datalist (iPhone не показывает список) */
.field { position: relative; }
.sugg { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); max-height: 228px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sugg button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: 11px 14px; font-size: 15px; border-bottom: 1px solid var(--line); cursor: pointer; }
.sugg button:last-child { border-bottom: 0; }
.sugg button:active, .sugg button.hl { background: var(--surface-2); }
.sugg mark { background: transparent; color: var(--orange-strong); font-weight: 700; }
/* дата на iPhone вылезала за край */
.two > * { min-width: 0; }
.field input[type=date], .rp-dates input[type=date] { -webkit-appearance: none; appearance: none; min-width: 0; min-height: 44px; text-align: left; }
.field input::-webkit-date-and-time-value { text-align: left; }
.theme-btn svg { width: 17px; height: 17px; }

/* ===== тёмная тема ===== */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --surface: #111113; --surface-2: #1C1C1F; --line: #232327;
  --text: #F2F2F4; --muted: #8E8E96; --beige-deep: #1C1C1F;
  --orange: #F07A2E; --orange-strong: #FF9450; --orange-soft: #3A2416;
  --green: #3DBA74; --green-soft: #15291D; --red: #F0675A; --red-soft: #3A1B18;
  --amber: #E0A63C; --amber-soft: #33270F;
  --blue: #6B6B74; --blue-strong: #F2F2F4; --blue-soft: #1C1C1F; --blue-softer: #1C1C1F;
  --shadow: none;
}
:root[data-theme="dark"] .nav { background: rgba(0, 0, 0, .86); border-top-color: var(--line); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px); }
:root[data-theme="dark"] .home-logo, :root[data-theme="dark"] .logo, :root[data-theme="dark"] .boot-logo { filter: invert(1) hue-rotate(180deg); }
:root[data-theme="dark"] .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
:root[data-theme="dark"] .seg { background: #111113; }
:root[data-theme="dark"] .seg button.on { background: var(--surface-2); }
:root[data-theme="dark"] .banner { color: var(--amber); }
:root[data-theme="dark"] .banner.ok { color: var(--green); }
:root[data-theme="dark"] .tag.warn, :root[data-theme="dark"] .tag.s-way { color: var(--amber); }
:root[data-theme="dark"] .tag.s-bought { background: #2A2238; color: #B79BE0; }
:root[data-theme="dark"] .tag.s-cancel { background: #1C1C1F; color: var(--muted); }
:root[data-theme="dark"] .ico.mv, :root[data-theme="dark"] .ico.neutral { color: var(--muted); }
:root[data-theme="dark"] .overlay { background: rgba(0, 0, 0, .7); }
:root[data-theme="dark"] .toast { background: #ECEEF2; color: #0F1115; }
:root[data-theme="dark"] .skeleton { background: linear-gradient(90deg, #141416, #222226, #141416); background-size: 200% 100%; }
:root[data-theme="dark"] .seg button { color: var(--muted); }
:root[data-theme="dark"] .seg button.on { color: var(--text); }
:root[data-theme="dark"] .rp-out { opacity: 1; }
:root[data-theme="dark"] .quick button:first-child { color: #fff; }
:root[data-theme="dark"] .sugg { box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
:root[data-theme="dark"] .fab { box-shadow: 0 4px 14px rgba(0, 0, 0, .5); }

/* ---------- плавность ---------- */
html { -webkit-text-size-adjust: 100%; }
body { touch-action: manipulation; -webkit-font-smoothing: antialiased; }
.main.enter { animation: viewIn .26s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.row, .chip, .btn, .fab, .icon-btn, .card[data-obj], .seg button, .nav button, .more, .banner, .sheet h3 .x {
  transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .16s cubic-bezier(.2, .8, .2, 1), opacity .18s ease, box-shadow .2s ease;
}
.chip:active, .btn:active, .icon-btn:active, .seg button:active, .more:active, .sheet h3 .x:active { transform: scale(.96); }
.fab:active { transform: scale(.92); }
.row:active { transform: scale(.992); }
.nav button:active .pill { transform: scale(.9); }
.nav .pill { transition: transform .16s cubic-bezier(.2, .8, .2, 1), background-color .2s ease, color .2s ease; }
.btn:disabled { opacity: .6; }
.overlay { transition: opacity .32s ease; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.sheet { transition: transform .38s cubic-bezier(.32, .72, 0, 1); will-change: transform; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet.drag { transition: none; }
.sheet .grab { cursor: grab; }
.toast { transition: opacity .25s ease, transform .3s cubic-bezier(.2, .8, .2, 1); }
.icon-btn.spin svg { animation-timing-function: cubic-bezier(.5, .1, .5, .9); }
.boot, .gate { animation: viewIn .4s ease both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- плавность, часть 2 ---------- */
html { scroll-behavior: smooth; }
body { transition: background-color .35s ease, color .35s ease; }
/* запасной путь смены темы (без View Transitions): все цвета плавно перетекают */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
  transition: background-color .4s ease, color .4s ease, border-color .4s ease, fill .4s ease, stroke .4s ease, box-shadow .4s ease !important;
}
/* View Transitions: смена темы и вкладок — мягкое перетекание */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .26s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
html.vt-theme::view-transition-old(root), html.vt-theme::view-transition-new(root) { animation-duration: .45s; animation-timing-function: ease; }
.nav { view-transition-name: nav; }
::view-transition-group(nav) { animation: none; }
/* при входе на экран строки и карточки появляются лесенкой */
.main.enter .card, .main.enter .list, .main.enter .totals, .main.enter .chips, .main.enter .seg, .main.enter .banner, .main.enter .grid2 {
  animation: rise .34s cubic-bezier(.2, .8, .2, 1) both;
}
.main.enter > :nth-child(2) { animation-delay: .03s; } .main.enter > :nth-child(3) { animation-delay: .06s; }
.main.enter > :nth-child(4) { animation-delay: .09s; } .main.enter > :nth-child(5) { animation-delay: .12s; }
.main.enter > :nth-child(n+6) { animation-delay: .15s; }
.main.enter .list .row:nth-child(-n+14) { animation: rowIn .32s cubic-bezier(.2, .8, .2, 1) both; }
.main.enter .list .row:nth-child(2) { animation-delay: .04s; } .main.enter .list .row:nth-child(3) { animation-delay: .07s; }
.main.enter .list .row:nth-child(4) { animation-delay: .1s; } .main.enter .list .row:nth-child(5) { animation-delay: .13s; }
.main.enter .list .row:nth-child(n+6):nth-child(-n+14) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
/* содержимое шторки проявляется вслед за ней */
.sheet.show > * { animation: rise .32s cubic-bezier(.2, .8, .2, 1) both; animation-delay: .06s; }
.sheet.show > .grab, .sheet.show > h3 { animation-delay: 0s; }
/* подсказки, ошибки, баннеры */
.sugg { animation: pop .16s cubic-bezier(.2, .8, .2, 1) both; transform-origin: top center; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
#f-err:not(:empty), .err:not(:empty) { animation: shake .3s ease both; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.field input, .field select, .field textarea { transition: border-color .18s ease, box-shadow .2s ease, background-color .3s ease; }
.seg button { transition: background-color .22s ease, color .22s ease, box-shadow .22s ease, transform .16s cubic-bezier(.2, .8, .2, 1); }
.theme-btn svg { transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.theme-btn:active svg { transform: rotate(-40deg) scale(.9); }
.icon-btn { transition: background-color .18s ease, transform .16s cubic-bezier(.2, .8, .2, 1); }
.icon-btn:active { transform: scale(.92); }
img { transition: opacity .3s ease; }
.boot-logo, .home-logo, .logo { transition: filter .4s ease, opacity .3s ease; }
.amt, .num { transition: color .3s ease; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
}

/* ---------- анимации иконок меню ---------- */
.nav .pill { position: relative; overflow: visible; }
.nav .pill svg { transform-origin: 50% 80%; }
/* Деньги: из-за купюры выезжают ещё две — вверх и вниз, быстро дрожат и плавно прячутся обратно */
.pill-money svg { position: relative; z-index: 1; }
.bills { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 0; }
.bills i { position: absolute; left: -10px; top: -7px; width: 20px; height: 14px; border-radius: 3px; opacity: 0;
  border: 1.8px solid currentColor; background: var(--bg); }
.bills i::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; border: 1.5px solid currentColor; }
.pill-money.play .bills i:nth-child(1) { animation: billUp 1.1s both; }
.pill-money.play .bills i:nth-child(2) { animation: billDown 1.1s both; }
.pill-money.play svg { animation: billMain 1.1s both; }
@keyframes billUp {
  0% { opacity: 0; transform: none; animation-timing-function: cubic-bezier(.2, .9, .3, 1.2); }
  10% { opacity: 1; }
  24% { transform: translate(0, -11px) rotate(-3deg); animation-timing-function: ease-in-out; }
  33% { transform: translate(-1.5px, -11px) rotate(6deg); }
  42% { transform: translate(1.5px, -11px) rotate(-6deg); }
  51% { transform: translate(-1px, -11px) rotate(5deg); }
  60% { transform: translate(1px, -11px) rotate(-3deg); }
  70% { transform: translate(0, -11px) rotate(0); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
  100% { transform: none; opacity: 0; }
}
@keyframes billDown {
  0% { opacity: 0; transform: none; animation-timing-function: cubic-bezier(.2, .9, .3, 1.2); }
  10% { opacity: 1; }
  24% { transform: translate(0, 11px) rotate(3deg); animation-timing-function: ease-in-out; }
  33% { transform: translate(1.5px, 11px) rotate(-6deg); }
  42% { transform: translate(-1.5px, 11px) rotate(6deg); }
  51% { transform: translate(1px, 11px) rotate(-5deg); }
  60% { transform: translate(-1px, 11px) rotate(3deg); }
  70% { transform: translate(0, 11px) rotate(0); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
  100% { transform: none; opacity: 0; }
}
@keyframes billMain { 0%, 100% { transform: none; } 24% { transform: scale(1.08); } 33% { transform: scale(1.08) rotate(-3deg); } 42% { transform: scale(1.08) rotate(3deg); } 51% { transform: scale(1.06) rotate(-2deg); } 70% { transform: scale(1.04); } }
/* Главная: домик подпрыгивает */
.pill-home.play svg { animation: hop .6s cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes hop { 0% { transform: none; } 25% { transform: scale(1.12, .85); } 55% { transform: translateY(-7px) scale(.95, 1.08); } 80% { transform: scale(1.05, .95); } 100% { transform: none; } }
/* Клиенты: человечки машут */
.pill-cli.play svg { animation: wave .7s ease both; }
@keyframes wave { 0%, 100% { transform: none; } 20% { transform: rotate(-12deg) scale(1.1); } 45% { transform: rotate(10deg) scale(1.1); } 70% { transform: rotate(-5deg); } }
/* Долги: листок переворачивается */
.pill-debt.play svg { animation: flip .7s cubic-bezier(.3, 1.2, .5, 1) both; transform-origin: 50% 50%; }
@keyframes flip { 0% { transform: perspective(60px) rotateY(0); } 60% { transform: perspective(60px) rotateY(200deg); } 100% { transform: perspective(60px) rotateY(360deg); } }
/* Кнопка «+» поворачивается, кнопка отчёта — столбики пульсируют */
.fab svg { transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); }
.fab:active svg { transform: rotate(90deg); }
.rp-open-btn:active svg { animation: bars .5s ease both; transform-origin: 50% 100%; }
@keyframes bars { 0%, 100% { transform: none; } 40% { transform: scaleY(.6); } 70% { transform: scaleY(1.12); } }
@media (prefers-reduced-motion: reduce) { .bills { display: none; } }

const CRM_KEY = (() => {
  const injected = /^[A-Za-z0-9]{24,64}$/.test(window.CRM_KEY || '') ? window.CRM_KEY : '';
  if (injected) {
    try { if (localStorage.getItem('sk-crm-key-v1') !== injected) { localStorage.removeItem('sk-crm-data-v2'); localStorage.removeItem('sk-crm-user-v1'); localStorage.setItem('sk-crm-key-v1', injected); } } catch (e) {}
    return injected;
  }
  // своя страница: ключ из ?k=..., запоминаем. Ключ остаётся в адресе, чтобы ссылку можно было скопировать в другой браузер
  let k = '';
  try { k = new URLSearchParams(location.search).get('k') || ''; } catch (e) {}
  if (/^[A-Za-z0-9]{24,64}$/.test(k)) {
    try {
      // другой человек на этом устройстве — стираем чужие сохранённые данные
      if (localStorage.getItem('sk-crm-key-v1') !== k) { localStorage.removeItem('sk-crm-data-v2'); localStorage.removeItem('sk-crm-user-v1'); }
      localStorage.setItem('sk-crm-key-v1', k);

  try { history.replaceState(null, '', location.pathname + '?k=' + k); } catch (e) {}

const money = (n, sign) => {
  const v = Math.round(Number(n) || 0);
  const s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (v < 0 ? '−' : sign && v > 0 ? '+' : '') + s + ' ₽';
};
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_N = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const todayISO = () => { const d = new Date(Date.now() + 3 * 3600e3); return d.toISOString().slice(0, 10); };   // Москва
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtDay = iso => {
  if (!iso) return '';
  if (iso === todayISO()) return 'Сегодня';
  if (iso === addDays(todayISO(), -1)) return 'Вчера';
  if (iso === addDays(todayISO(), 1)) return 'Завтра';
  const [y, m, d] = iso.split('-').map(Number);
  return d + ' ' + MONTHS[m - 1] + (String(y) !== todayISO().slice(0, 4) ? ' ' + y : '');
};
const short = iso => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) : '';

};

// ---------- сеть ----------
async function call(path, opts = {}) {
  if (!opts.body && !opts.noRetry) {
    for (let i = 0; ; i++) {
      try { return await call(path, Object.assign({}, opts, { noRetry: true })); }
      catch (e) { if (i >= 2) throw e; await sleep(500 * (i + 1)); }
    }
  }
  return await gsRun(path, opts.method || 'GET', opts.body);
}
// Своя страница: тот же API через POST в Apps Script. text/plain — без CORS-preflight, ключ в теле, не в адресе.
async function gsFetch(path, method, body) {
  let r;
  try {
    r = await fetch(CRM_API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ crm_web: 1, k: CRM_KEY, path, method, body: body ? JSON.stringify(body) : '' }) });
  } catch (e) { throw new Error('Нет связи с сервером'); }
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { throw new Error('Сервер не ответил'); }
}
function gsRun(path, method, body) {
  if (!IN_GAS) return gsFetch(path, method, body);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(t => { try { resolve(JSON.parse(t)); } catch (e) { reject(new Error('Сервер не ответил')); } })
      .withFailureHandler(e => reject(new Error((e && e.message) || 'Нет связи с сервером')))
      .crmWebApi(CRM_KEY, path, method, body ? JSON.stringify(body) : '');

}
const newRid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
const sleep = ms => new Promise(r => setTimeout(r, ms));
// iPhone иногда рвёт запрос на «уснувшем» соединении (Load failed). Повторяем с тем же rid — сервер не запишет дважды.
async function action(name, payload) {
  const rid = newRid();
  let j, lastErr;
  for (let attempt = 0; attempt < 4; attempt++) {
    try { j = await call('/api/action', { method: 'POST', body: { action: name, payload, rid } }); break; }
    catch (e) { lastErr = e; await sleep([400, 1200, 2500][attempt] || 2500); }
  }
  if (!j) throw new Error('Нет связи с сервером. Проверь интернет и нажми ещё раз — дубля не будет.' + (lastErr && lastErr.message ? ' (' + lastErr.message + ')' : ''));

  return j.result;
}

const SHORT_NAMES = { 'женя': 'Евгений', 'жека': 'Евгений', 'ваня': 'Иван', 'стас': 'Станислав', 'илюха': 'Илья' };

function cpResolve(name) {

function cpDist(a, b) {

  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {

    if (single) f.split(' ').forEach(w => { if (w.length >= 4 && w !== f) d = Math.min(d, cpDist(q, w) + 0.5); });
    if (q.length >= 4 && f.startsWith(q)) d = Math.min(d, 1);

// Отчёт по каждому контрагенту за период: сколько мы им заплатили, сколько от них получили,

function cpStatsAll(period) {

}

(function () {

    list.sort((a, b) => (norm(b).startsWith(q) ? 1 : 0) - (norm(a).startsWith(q) ? 1 : 0));
    list = list.slice(0, 40);

  }

    if (inp.hasAttribute('list')) { inp.dataset.dl = inp.getAttribute('list'); inp.removeAttribute('list'); }
    if (!inp.dataset.dl) return;

  });

  const ops = S.data.ops.filter(o => o.date && o.date >= from && o.date <= to && (o.type === 'Приход' || o.type === 'Расход') && (!acc || o.acc === acc));
  let inc = 0, out = 0, bad = 0;
  ops.forEach(o => { if (o.type === 'Приход') inc += o.amount; else out += o.amount; if (o.check && o.check !== 'ОК') bad++; });
  return { ops, inc, out, bad };
}
function rpGroup(ops, type, keyFn) {
  const m = new Map();
  ops.filter(o => o.type === type).forEach(o => {
    const k = keyFn(o) || 'Без статьи';
    const g = m.get(k) || { name: k, sum: 0, ops: [] };
    g.sum += o.amount; g.ops.push(o); m.set(k, g);
  });
  return [...m.values()].sort((a, b) => b.sum - a.sum);
}
function rpDelta(cur, prev, invert) {
  if (!prev) return '<span class="rp-dim">нет данных за прошлый период</span>';
  const p = Math.round((cur - prev) / Math.abs(prev) * 100);
  if (!p) return '<span class="rp-dim">как в прошлом периоде</span>';
  const good = invert ? p < 0 : p > 0;
  return '<span class="' + (good ? 'up' : 'down') + '">' + (p > 0 ? '+' : '−') + Math.abs(p) + '%</span> <span class="rp-dim">к прошлому периоду</span>';
}

// столбики приход/расход по дням, неделям или месяцам
function rpChart(ops, from, to) {
  const days = rpDays(from, to);
  const unit = days <= 31 ? 'day' : days <= 120 ? 'week' : 'month';
  const keyOf = iso => {
    if (unit === 'day') return iso;
    if (unit === 'month') return iso.slice(0, 7);
    const n = Math.floor(rpDays(from, iso) / 7); return addDays(from, n * 7);
  };
  const buckets = [];
  if (unit === 'month') { let c = from.slice(0, 7); while (c <= to.slice(0, 7)) { buckets.push(c); const [yy, mm] = c.split('-').map(Number); c = (mm === 12 ? yy + 1 : yy) + '-' + String(mm === 12 ? 1 : mm + 1).padStart(2, '0'); } }
  else for (let d = from; d <= to; d = addDays(d, unit === 'day' ? 1 : 7)) buckets.push(d);
  const inc = {}, out = {};
  ops.forEach(o => { const k = keyOf(o.date); (o.type === 'Приход' ? inc : out)[k] = ((o.type === 'Приход' ? inc : out)[k] || 0) + o.amount; });
  const max = Math.max(1, ...buckets.map(b => Math.max(inc[b] || 0, out[b] || 0)));
  const W = 600, H = 150, n = buckets.length, slot = (W - 4) / n, bw = Math.max(1.5, Math.min(14, slot / 2 - 1.5));
  const label = b => unit === 'month' ? MONTHS_N[+b.slice(5, 7) - 1].slice(0, 3) : short(b);
  const every = Math.ceil(n / 7);
  let svg = '<svg class="rp-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Поступления и расходы по ' + (unit === 'day' ? 'дням' : unit === 'week' ? 'неделям' : 'месяцам') + '">';
  svg += '<line x1="0" x2="' + W + '" y1="' + H + '" y2="' + H + '" class="rp-axis"/>';
  buckets.forEach((b, i) => {
    const x = 2 + i * slot + slot / 2, hi = (inc[b] || 0) / max * (H - 6), ho = (out[b] || 0) / max * (H - 6);
    const tip = label(b) + ': приход ' + money(inc[b] || 0) + ', расход ' + money(out[b] || 0);
    svg += '<g><title>' + esc(tip) + '</title><rect class="rp-in" x="' + (x - bw - 0.5).toFixed(1) + '" y="' + (H - hi).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hi.toFixed(1) + '" rx="1.5"/>' +
      '<rect class="rp-out" x="' + (x + 0.5).toFixed(1) + '" y="' + (H - ho).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + ho.toFixed(1) + '" rx="1.5"/></g>';
  });
  svg += '</svg>';
  let lbls = '<div class="rp-lbls">';
  buckets.forEach((b, i) => { if (i % every === 0) lbls += '<span style="left:' + ((2 + i * slot + slot / 2) / W * 100).toFixed(2) + '%">' + esc(label(b)) + '</span>'; });
  lbls += '</div>';
  svg += lbls;
  return '<div class="card rp-chart-card"><div class="rp-legend"><span><i class="rp-dot in"></i>Поступления</span><span><i class="rp-dot out"></i>Расходы</span><span class="rp-dim">по ' + (unit === 'day' ? 'дням' : unit === 'week' ? 'неделям' : 'месяцам') + '</span></div>' + svg + '</div>';
}

function rpBreakdown(title, groups, total, type, kind) {
  if (!groups.length) return '<div class="section-title"><h2>' + title + '</h2></div><div class="list"><div class="empty">Нет операций за период</div></div>';
  const open = S.report.open;
  return '<div class="section-title"><h2>' + title + '</h2><span class="rp-dim">' + money(total) + '</span></div><div class="list">' + groups.map(g => {
    const id = kind + ':' + g.name, isOpen = open === id, share = total ? g.sum / total * 100 : 0;
    const card = kind !== 'cat' && g.name && g.name !== '—' && !/^без /i.test(g.name);
    let h = '<div class="row rp-row" ' + (card ? 'data-rpcp="' + esc(g.name) + '"' : 'data-rp="' + esc(id) + '"') + '><div class="body"><div class="t1">' + esc(g.name) + '</div>' +
      '<div class="rp-bar"><i class="' + (type === 'Приход' ? 'in' : 'out') + '" style="width:' + Math.max(1, share).toFixed(1) + '%"></i></div></div>' +
      '<div class="amt num">' + money(g.sum) + '<small>' + (share < 1 ? '<1' : Math.round(share)) + '% · ' + g.ops.length + ' оп.</small></div></div>';
    if (isOpen && !card) {
      const sub = new Map(); g.ops.forEach(o => { const k = (kind === 'cat' ? (o.cp || o.client) : o.cat) || '—'; sub.set(k, (sub.get(k) || 0) + o.amount); });
      const subs = [...sub.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
      h += '<div class="rp-open">' + (subs.length > 1 ? '<div class="rp-subs">' + subs.map(([k, v]) => '<span>' + esc(k) + ' <b class="num">' + money(v) + '</b></span>').join('') + '</div>' : '') +
        g.ops.slice().sort((a, b) => b.date.localeCompare(a.date) || b.row - a.row).slice(0, 30).map(o =>
          '<div class="rp-op" data-op="' + o.row + '"><span class="rp-dim">' + short(o.date) + '</span><span class="rp-op-t">' + esc([o.cp, o.client && o.client !== o.cp ? 'для ' + o.client : '', o.comment].filter(Boolean).join(' · ') || o.cat || '—') + '</span><b class="num">' + money(o.amount) + '</b></div>').join('') +
        (g.ops.length > 30 ? '<div class="rp-dim rp-more">и ещё ' + (g.ops.length - 30) + '</div>' : '') + '</div>';
    }
    return h;
  }).join('') + '</div>';
}

function viewReport() {
  const r = S.report;
  if (!r.from) [r.from, r.to] = rpRange(r.preset);

  const pFrom = addDays(r.from, -len), pTo = addDays(r.from, -1);
  const prev = rpCollect(pFrom, pTo, r.acc);
  const net = cur.inc - cur.out, pnet = prev.inc - prev.out;
  const accs = [...new Set(S.data.ops.filter(o => o.type !== 'Перевод').map(o => o.acc).filter(Boolean))];

  h += '<div class="rp-dates"><label>с <input type="date" id="rp-from" value="' + r.from + '" max="' + r.to + '"></label><label>по <input type="date" id="rp-to" value="' + r.to + '" min="' + r.from + '"></label></div>';
  h += '<div class="chips"><button class="chip ' + (!r.acc ? 'on' : '') + '" data-rpa="">Все счета</button>' + accs.map(a => '<button class="chip ' + (r.acc === a ? 'on' : '') + '" data-rpa="' + esc(a) + '">' + esc(a) + '</button>').join('') + '</div>';

  h += '<div class="card hero"><div class="label">Чистый денежный поток</div><div class="value num ' + (net < 0 ? 'neg' : 'pos') + '">' + money(net, true) + '</div>' +
    '<div class="sub">' + rpDate(r.from) + ' — ' + rpDate(r.to) + ' · ' + len + ' ' + plural(len, 'день', 'дня', 'дней') + ' · ' + cur.ops.length + ' ' + plural(cur.ops.length, 'операция', 'операции', 'операций') + '</div>' +
    '<div class="sub" style="margin-top:4px">Прошлый период (' + short(pFrom) + ' — ' + short(pTo) + '): <b class="num">' + money(pnet, true) + '</b></div></div>';
  h += '<div class="grid2"><div class="card kpi"><div class="label">Поступления</div><div class="value num pos">' + money(cur.inc) + '</div><div class="sub">' + rpDelta(cur.inc, prev.inc) + '</div></div>' +
    '<div class="card kpi"><div class="label">Расходы</div><div class="value num">' + money(cur.out) + '</div><div class="sub">' + rpDelta(cur.out, prev.out, true) + '</div></div></div>';
  if (cur.bad) h += '<div class="banner">⚠️ <span>' + cur.bad + ' ' + plural(cur.bad, 'операция', 'операции', 'операций') + ' за период с ошибками — итоги могут быть неточными</span></div>';

  if (!cur.ops.length) return shell(h + '<div class="list" style="margin-top:12px"><div class="empty">За этот период операций нет</div></div>', false);

  h += '<div class="section-title"><h2>Динамика</h2></div>' + rpChart(cur.ops, r.from, r.to);
  h += rpBreakdown('Поступления по статьям', rpGroup(cur.ops, 'Приход', o => o.cat), cur.inc, 'Приход', 'cat');
  h += rpBreakdown('Расходы по статьям', rpGroup(cur.ops, 'Расход', o => o.cat), cur.out, 'Расход', 'cat');
  h += rpBreakdown('Поступления от клиентов', rpGroup(cur.ops, 'Приход', o => o.client || o.cp), cur.inc, 'Приход', 'cli');
  h += rpBreakdown('Кому платили', rpGroup(cur.ops, 'Расход', o => o.cp), cur.out, 'Расход', 'cp');

  if (!r.acc) {
    const byAcc = new Map();
    cur.ops.forEach(o => { const a = byAcc.get(o.acc) || { inc: 0, out: 0 }; if (o.type === 'Приход') a.inc += o.amount; else a.out += o.amount; byAcc.set(o.acc, a); });
    h += '<div class="section-title"><h2>По счетам</h2></div><div class="list"><div class="rp-tbl rp-th"><span>Счёт</span><span>Приход</span><span>Расход</span><span>Итого</span></div>' +
      [...byAcc.entries()].sort((a, b) => (b[1].inc + b[1].out) - (a[1].inc + a[1].out)).map(([k, v]) =>
        '<div class="rp-tbl"><span>' + esc(k || '—') + '</span><span class="num pos">' + money(v.inc) + '</span><span class="num">' + money(v.out) + '</span><b class="num ' + (v.inc - v.out < 0 ? 'neg' : '') + '">' + money(v.inc - v.out, true) + '</b></div>').join('') + '</div>';
  }
  h += '<div class="stale">Переводы между счетами в отчёт не входят — это не приход и не расход компании</div>';
  return shell(h, false);
}

function rpCsv() {
  const r = S.report, cur = rpCollect(r.from, r.to, r.acc);
  const q = v => { const s = String(v === null || v === undefined ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Дата', 'Тип', 'Счёт', 'Сумма', 'Статья', 'Контрагент', 'Клиент', 'Комментарий']];
  cur.ops.slice().sort((a, b) => a.date.localeCompare(b.date) || a.row - b.row)
    .forEach(o => rows.push([rpDate(o.date), o.type, o.acc, String(o.type === 'Расход' ? -o.amount : o.amount).replace('.', ','), o.cat, o.cp, o.client, o.comment]));
  rows.push([], ['Поступления', '', '', String(cur.inc).replace('.', ',')], ['Расходы', '', '', String(-cur.out).replace('.', ',')], ['Чистый поток', '', '', String(cur.inc - cur.out).replace('.', ',')]);
  const csv = '﻿' + rows.map(row => row.map(q).join(';')).join('\r\n');
  const name = 'ДДС_' + r.from + '_' + r.to + (r.acc ? '_' + r.acc : '') + '.csv';
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Файл ' + name + ' скачан');
  } catch (e) { toast('Не получилось скачать файл в этом окне — открой CRM в браузере'); }
}

function opRow(o) {
  const cls = o.type === 'Приход' ? 'in' : o.type === 'Расход' ? 'out' : 'mv';
  const sign = o.type === 'Приход' ? '+' : o.type === 'Расход' ? '−' : '⇄';
  const title = o.type === 'Перевод' ? o.acc + ' → ' + o.to : (o.cp || o.cat || o.comment || o.type);
  const sub = o.type === 'Перевод' ? (o.comment || o.cat || 'Перевод') : [o.cat !== title ? o.cat : '', o.client ? 'для ' + o.client : '', o.comment !== title ? o.comment : ''].filter(Boolean).join(' · ');
  const bad = o.check && o.check !== 'ОК';
  return '<div class="row" data-op="' + o.row + '"><div class="ico ' + cls + '">' + sign + '</div><div class="body"><div class="t1">' + esc(title) +
    (bad ? ' <span class="tag warn">ошибка</span>' : '') + '</div><div class="t2">' + esc(sub || '—') + '</div></div><div class="amt num ' + (o.type === 'Приход' ? 'pos' : '') + '">' +
    (o.type === 'Расход' ? '−' : o.type === 'Приход' ? '+' : '') + esc(money(o.amount)) + '<small>' + esc(o.type === 'Перевод' ? short(o.date) : o.acc) + '</small></div></div>';
}
function filteredOps() {
  const f = S.money, q = norm(f.q);
  return S.data.opsDesc.filter(o => {
    if (f.type !== 'all' && o.type !== f.type) return false;
    if (f.acc && o.acc !== f.acc && o.to !== f.acc) return false;
    if (f.month && (o.date || '').slice(0, 7) !== f.month) return false;
    if (f.errors && (!o.check || o.check === 'ОК')) return false;
    if (q) {
      const hay = norm([o.cp, o.client, o.cat, o.comment, o.acc, o.to, o.amount, o.row].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}
function viewMoney() {

  kv.forEach(([k, v]) => { if (v) h += '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>'; });

  h += '<button class="btn ghost" id="d-copy">Повторить запись</button>';
  if (S.user.role === 'owner') h += '<button class="btn danger" id="d-del">Удалить строку из таблицы</button>';
  openSheet(h, sh => {
    const cp = $('#d-cp', sh); if (cp) cp.onclick = () => { closeSheet(); Object.assign(S.money, { q: o.cp, type: 'all', acc: '', month: '', errors: false }); go('money'); };
    $('#d-copy', sh).onclick = () => { closeSheet(); setTimeout(() => formOp({ type: o.type, acc: o.acc, to: o.to, cat: o.cat, cp: o.cp, client: o.client, comment: o.comment }), 260); };
    const del = $('#d-del', sh);

let lastAcc = '';
try { lastAcc = localStorage.getItem('sk-acc') || ''; } catch (e) {}
function formOp(pre = {}) {
  const accs = accounts();

  const st = { type: pre.type || 'Расход' };
  const opts = (list, sel, empty) => (empty ? '<option value="">' + empty + '</option>' : '') + list.map(x => '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  const catsFor = t => t === 'Приход' ? S.data.refs.income : t === 'Расход' ? S.data.refs.expense : ['ПО (выдано под отчёт)'];
  const draw = () => {
    const t = st.type;
    let h = '<h3>Новая операция<button class="x" data-close>×</button></h3>';
    h += '<div class="seg">' + ['Расход', 'Приход', 'Перевод'].map(x => '<button data-t="' + x + '" class="' + (t === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div>';
    h += '<div class="field"><label>Сумма, ₽</label><input class="amount num" id="f-amount" inputmode="decimal" placeholder="0" value="' + esc(pre.amount || '') + '"></div>';
    h += '<div class="two"><div class="field"><label>' + (t === 'Перевод' ? 'Откуда' : 'Счёт') + '</label><select id="f-acc">' + opts(accs, $('#f-acc') ? $('#f-acc').value : defAcc) + '</select></div>';
    h += t === 'Перевод'
      ? '<div class="field"><label>Куда</label><select id="f-to">' + opts(accs, pre.to || '', 'Выбери') + '</select></div></div>'
      : '<div class="field"><label>Дата</label><input type="date" id="f-date" value="' + (pre.date || todayISO()) + '" max="' + todayISO() + '"></div></div>';
    if (t === 'Перевод') h += '<div class="field"><label>Дата</label><input type="date" id="f-date" value="' + (pre.date || todayISO()) + '" max="' + todayISO() + '"></div>';
    else {
      h += '<div class="field"><label>Категория</label><select id="f-cat">' + opts(catsFor(t), pre.cat || '', 'Выбери категорию') + '</select></div>';
      h += '<div class="field"><label>' + (t === 'Приход' ? 'От кого' : 'Кому (контрагент)') + '</label><input id="f-cp" list="dl-names" autocomplete="off" value="' + esc(pre.cp || '') + '" placeholder="Начни писать имя"></div>';
      h += '<div class="field"><label>Клиент (для кого)</label><input id="f-client" list="dl-clients" autocomplete="off" value="' + esc(pre.client || '') + '" placeholder="Необязательно"></div>';
    }
    h += '<div class="field"><label>Комментарий</label><input id="f-comment" value="' + esc(pre.comment || '') + '" placeholder="Объект, за что"></div>';
    if (t === 'Перевод') h += '<div class="hint">Перевод — деньги переходят между кассами (ПО, снятие с ИП). Баланс компании не меняется. Клиента у переводов не указываем.</div>';
    h += '<div class="err" id="f-err"></div><button class="btn" id="f-save">Записать в таблицу</button>';
    h += '<datalist id="dl-names">' + refNames().sort((a, b) => a.localeCompare(b, 'ru')).map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>';
    h += '<datalist id="dl-clients">' + refNames().sort((a, b) => (cpRole(a) === 'Клиент' ? 0 : 1) - (cpRole(b) === 'Клиент' ? 0 : 1) || a.localeCompare(b, 'ru')).map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>';
    return h;
  };
  openSheet(draw(), function bind(sh) {
    sh.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      ['amount', 'comment', 'cp', 'client', 'cat', 'to', 'date'].forEach(k => { const el = $('#f-' + k, sh); if (el) pre[k] = el.value; });
      st.type = b.dataset.t;
      sh.querySelector('.sheet-body').innerHTML = draw(); bind(sh);
    });
    const amount = $('#f-amount', sh);
    if (!pre.amount) setTimeout(() => amount.focus(), 280);
    amount.oninput = () => { const v = amount.value.replace(/[^\d.,\s]/g, ''); if (v !== amount.value) amount.value = v; };
    $('#f-save', sh).onclick = async () => {
      const err = $('#f-err', sh);
      const val = k => { const el = $('#f-' + k, sh); return el ? el.value.trim() : ''; };
      const op = { type: st.type, amount: Number(val('amount').replace(/\s/g, '').replace(',', '.')), acc: val('acc'), to: val('to'), date: val('date'),
        cat: st.type === 'Перевод' ? 'ПО (выдано под отчёт)' : val('cat'), cp: val('cp'), client: val('client'), comment: val('comment') };
      if (!(op.amount > 0)) { err.textContent = 'Укажи сумму'; return; }
      if (st.type === 'Перевод' && (!op.to || op.to === op.acc)) { err.textContent = 'Выбери, куда перевод'; return; }
      if (st.type !== 'Перевод' && !op.cat) { err.textContent = 'Выбери категорию'; return; }
      if (op.date > todayISO()) { err.textContent = 'Дата в будущем'; return; }
      // контрагент и клиент — только из справочника; при опечатке предлагаем ближайшее имя кнопкой
      if (st.type !== 'Перевод') {
        for (const [f, what] of [['cp', 'Контрагента'], ['client', 'Клиента']]) {
          if (!op[f]) continue;
          const k = cpResolve(op[f]);
          if (k) { op[f] = k; $('#f-' + f, sh).value = k; continue; }
          const sug = cpSuggest(op[f]);
          err.innerHTML = esc(what + ' «' + op[f] + '» нет в справочнике — новых не создаём. ') +
            (sug.length ? 'Может, ' + sug.map(n => '<button class="chip" data-sug="' + f + '" data-v="' + esc(n) + '" style="margin:4px 4px 0 0">' + esc(n) + '</button>').join('') + '?' : 'Похожих нет: выбери из списка или оставь поле пустым. Новое имя добавляет Илья в СПРАВОЧНИК.');
          err.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { $('#f-' + b.dataset.sug, sh).value = b.dataset.v; err.textContent = ''; });
          $('#f-' + f, sh).focus();
          return;
        }
      }
      err.textContent = '';
      const btn = $('#f-save', sh); btn.disabled = true; btn.textContent = 'Записываю…';
      try {
        const r = await action('addOp', { op });
        try { localStorage.setItem('sk-acc', op.acc); lastAcc = op.acc; } catch (e) {}
        haptic('ok'); toast('Записано в строку ' + r.row); closeSheet(); await load(true);
      } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Записать в таблицу'; }
    };
  });
}

    });
    const rows = [...map.values()].sort((a, b) => b.sum - a.sum);
    const total = rows.reduce((s, x) => s + x.sum, 0);
    h += '<div class="card hero"><div class="label">Доставка и разгрузка</div><div class="value num">' + money(total) + '</div><div class="sub">' + rows.reduce((s, x) => s + x.n, 0) + ' выплат</div></div><div style="height:12px"></div>';
    h += '<div class="list">' + (rows.length ? rows.map(x => '<div class="row"' + (x.name !== 'Без имени' ? ' data-drv="' + esc(x.name) + '"' : '') + '><div class="ico mv">' + esc(x.name.charAt(0)) + '</div><div class="body"><div class="t1">' + esc(x.name) + '</div><div class="t2">' + x.n + ' ' + plural(x.n, 'выплата', 'выплаты', 'выплат') + '</div></div><div class="amt num">' + money(x.sum) + '</div></div>').join('') : '<div class="empty">Выплат за период нет</div>') + '</div>';
  }
  return shell(h, true);
}
function bindDebt() {
  document.querySelectorAll('[data-dt]').forEach(b => b.onclick = () => { S.debt.tab = b.dataset.dt; rerender(); });
  document.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { S.debt.period = b.dataset.pp; rerender(); });
  document.querySelectorAll('[data-drv]').forEach(el => el.onclick = () => { Object.assign(S.money, { q: el.dataset.drv, type: 'Расход', acc: '', month: '', errors: false }); go('money'); });
  document.querySelectorAll('[data-debt]').forEach(el => el.onclick = () => {
    const d = S.data.debts.find(x => x.row === +el.dataset.debt);
    if (!d) return;
    let h = '<h3>' + esc(d.who) + '<button class="x" data-close>×</button></h3><div class="detail-amt num">' + money(d.left) + '</div><dl class="kv"><dt>Долг</dt><dd>' + money(d.amount) + '</dd><dt>Вернули</dt><dd>' + money(d.returned) + '</dd><dt>За что</dt><dd>' + esc(d.reason || '—') + '</dd><dt>Когда</dt><dd>' + esc(fmtDay(d.date)) + '</dd></dl><div style="height:14px"></div>';
    h += '<div class="field"><label>Сколько вернули, ₽</label><input class="amount num" id="p-sum" inputmode="decimal" value="' + Math.round(d.left) + '"></div><div class="err" id="p-err"></div><button class="btn" id="p-save">Отметить возврат</button>';
    openSheet(h, sh => {
      $('#p-save', sh).onclick = async () => {
        const v = Number($('#p-sum', sh).value.replace(/\s/g, '').replace(',', '.'));
        if (!(v > 0)) { $('#p-err', sh).textContent = 'Укажи сумму'; return; }
        const btn = $('#p-save', sh); btn.disabled = true;
        try { await action('repayDebt', { row: d.row, who: d.who, amount: v }); haptic('ok'); toast('Возврат отмечен'); closeSheet(); await load(true); }
        catch (e) { $('#p-err', sh).textContent = e.message; btn.disabled = false; }
      };
    });
  });
}
function formDebt() {
  let h = '<h3>Новый долг<button class="x" data-close>×</button></h3>';
  h += '<div class="field"><label>Кто должен</label><input id="g-who" list="dl-names" autocomplete="off" placeholder="Имя"></div>';
  h += '<div class="field"><label>Сумма, ₽</label><input class="amount num" id="g-sum" inputmode="decimal" placeholder="0"></div>';
  h += '<div class="two"><div class="field"><label>За что</label><input id="g-reason" placeholder="Доставка, сдача"></div><div class="field"><label>Дата</label><input type="date" id="g-date" value="' + todayISO() + '" max="' + todayISO() + '"></div></div>';
  h += '<div class="err" id="g-err"></div><button class="btn" id="g-save">Записать долг</button>';
  h += '<datalist id="dl-names">' + allNames().map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>';
  openSheet(h, sh => {
    setTimeout(() => $('#g-who', sh).focus(), 280);
    $('#g-save', sh).onclick = async () => {
      const debt = { who: $('#g-who', sh).value.trim(), amount: Number($('#g-sum', sh).value.replace(/\s/g, '').replace(',', '.')), reason: $('#g-reason', sh).value.trim(), date: $('#g-date', sh).value };
      if (!debt.who || !(debt.amount > 0)) { $('#g-err', sh).textContent = 'Укажи, кто должен и сколько'; return; }
      const btn = $('#g-save', sh); btn.disabled = true;
      try { await action('addDebt', { debt }); haptic('ok'); toast('Долг записан'); closeSheet(); S.view = 'debt'; S.debt.tab = 'debts'; await load(true); }
      catch (e) { $('#g-err', sh).textContent = e.message; btn.disabled = false; }
    };
  });
}

// ---------- ДОСТУП (владелец) ----------
async function accessScreen() {
  openSheet('<h3>Доступ<button class="x" data-close>×</button></h3><div class="skeleton"></div>', async sh => {
    const draw = async () => {
      const j = await call('/api/access');
      if (!j.ok) { sh.querySelector('.sheet-body').innerHTML = '<h3>Доступ<button class="x" data-close>×</button></h3><div class="err">' + esc(j.error) + '</div>'; bindClose(sh); return; }
      let h = '<h3>Доступ<button class="x" data-close>×</button></h3>';
      h += '<div class="hint">Веб-версия: новых людей и новые ссылки Илья добавляет в Apps Script (функция crmWebSetup). Здесь можно отключить, вернуть или переименовать.</div>';
      if (j.requests.length) {
        h += '<div class="section-title" style="margin-top:6px"><h2>Ждут доступа</h2></div>';
        h += j.requests.map(r => '<div class="card"><b>' + esc(r.display_name || r.telegram_id) + '</b>' + (r.username ? ' <span style="color:var(--muted)">@' + esc(r.username) + '</span>' : '') + '<div class="hint" style="margin:4px 0 8px">ID ' + esc(r.telegram_id) + '</div>' +
          '<div class="field"><input data-name="' + esc(r.telegram_id) + '" placeholder="Имя в учёте, например Дмитрий" value="' + esc((r.display_name || '').split(' ')[0]) + '"></div><div class="two"><button class="btn" data-ok="' + esc(r.telegram_id) + '" data-un="' + esc(r.username || '') + '">Пустить</button><button class="btn ghost" data-no="' + esc(r.telegram_id) + '">Отклонить</button></div></div>').join('');
      }
      h += '<div class="section-title"><h2>Команда</h2></div><div class="list">' + j.users.map(u => '<div class="row"><div class="ico ' + (u.active ? 'mv' : 'neutral') + '">' + esc((u.name || '?').charAt(0)) + '</div><div class="body"><div class="t1">' + esc(u.name) +
        (j.owners.includes(String(u.telegram_id)) ? ' <span class="tag s-new">владелец</span>' : '') + (u.active ? '' : ' <span class="tag s-cancel">отключён</span>') + '</div><div class="t2">ID ' + esc(u.telegram_id) + '</div></div>' +
        (u.active && !j.owners.includes(String(u.telegram_id)) ? '<button class="chip" data-rm="' + esc(u.telegram_id) + '">Отключить</button>' : !u.active ? '<button class="chip" data-back="' + esc(u.telegram_id) + '" data-nm="' + esc(u.name) + '">Вернуть</button>' : '') + '</div>').join('') + '</div>';
      sh.querySelector('.sheet-body').innerHTML = h;
      bindClose(sh);
      const post = async (body, msg) => { const r = await call('/api/access', { method: 'POST', body }); if (!r.ok) toast(r.error); else { toast(msg); draw(); } };
      sh.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => post({ op: 'approve', id: b.dataset.ok, username: b.dataset.un, name: sh.querySelector('[data-name="' + b.dataset.ok + '"]').value }, 'Доступ выдан'));
      sh.querySelectorAll('[data-no]').forEach(b => b.onclick = () => post({ op: 'deny', id: b.dataset.no }, 'Запрос отклонён'));
      sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { if (await confirmBox('Отключить доступ?')) post({ op: 'remove', id: b.dataset.rm }, 'Доступ отключён'); });
      sh.querySelectorAll('[data-back]').forEach(b => b.onclick = () => post({ op: 'approve', id: b.dataset.back, name: b.dataset.nm }, 'Доступ возвращён'));
    };
    draw();
  });
}

// ---------- шторка, тост, подтверждение ----------
let sheetEl = null, overlayEl = null;
function openSheet(html, onMount) {
  closeSheet(true);
  overlayEl = document.createElement('div'); overlayEl.className = 'overlay';
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet';
  sheetEl.innerHTML = '<div class="grab"></div><div class="sheet-body">' + html + '</div>';
  document.body.append(overlayEl, sheetEl);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { overlayEl.classList.add('show'); sheetEl.classList.add('show'); });
  overlayEl.onclick = () => closeSheet();
  sheetEl.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheetBack); }
  dragToClose(sheetEl);
  if (onMount) onMount(sheetEl);
}
// Смахнуть шторку вниз: тянется за пальцем, отпустил ниже 110 px (или быстро) — закрывается
function dragToClose(el) {
  let y0 = 0, t0 = 0, dy = 0, on = false;
  el.addEventListener('touchstart', e => {
    if (el.scrollTop > 0 || e.touches.length > 1 || e.target.closest('input, textarea, select')) return;
    on = true; y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0;
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!on) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || el.scrollTop > 0) { if (dy < 0) on = false; el.style.transform = ''; el.classList.remove('drag'); return; }
    el.classList.add('drag');
    el.style.transform = 'translateY(' + dy + 'px)';
    if (overlayEl) overlayEl.style.opacity = String(Math.max(0, 1 - dy / 400));
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (!on) return;
    on = false;
    el.classList.remove('drag');
    const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.6;
    if (dy > 110 || fast) { el.style.transform = 'translateY(100%)'; closeSheet(); }
    else { el.style.transform = ''; if (overlayEl) overlayEl.style.opacity = ''; }
  });
}
function bindClose() { /* закрытие ловит общий обработчик шторки */ }
function closeSheetBack() { closeSheet(); }
function closeSheet(instant) {
  if (!sheetEl) return;
  const s = sheetEl, o = overlayEl;
  sheetEl = overlayEl = null;
  document.body.style.overflow = '';
  if (tg && tg.BackButton) { tg.BackButton.offClick(closeSheetBack); tg.BackButton.hide(); }
  if (instant) { s.remove(); o.remove(); return; }
  s.classList.remove('show'); o.classList.remove('show'); o.style.opacity = '0';
  setTimeout(() => { s.remove(); o.remove(); }, 380);
}
let toastT;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.append(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function confirmBox(text) {
  return new Promise(res => {
    if (tg && tg.showConfirm && tg.platform !== 'unknown') { tg.showConfirm(text, ok => res(!!ok)); return; }
    res(window.confirm(text));
  });
}

// ---------- старт ----------
function gate(title, text, extra) {
  S.gated = true;
  $('#app').innerHTML = '<div class="gate"><img src="' + LOGO + '" class="boot-logo" alt="SpaceKit"><h1>' + esc(title) + '</h1><p>' + text + '</p>' + (extra || '') + '</div>';
}
async function start() {
  if (tg) {
    try { tg.ready(); tg.expand(); applyTheme(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
  if (!CRM_KEY) { gate('Нужна личная ссылка', 'Открой CRM по своей личной ссылке — её выдаёт Илья.'); return; }
  // Мгновенный старт: если на устройстве уже есть данные — показываем их сразу, сессию проверяем параллельно
  let cachedUser = null;
  try { cachedUser = JSON.parse(localStorage.getItem('sk-crm-user-v1') || 'null'); } catch (e) {}
  if (cachedUser) {
    try { const c = localStorage.getItem(LS_KEY); if (c) { S.user = cachedUser; setData(JSON.parse(c)); render(); load(false); } } catch (e) {}
  }
  let s;
  try { s = await call('/api/session'); } catch (e) { if (cachedUser && S.data) { toast('Нет связи — показаны сохранённые данные'); return; } gate('Нет связи', esc(e.message), '<button class="btn" style="max-width:240px" onclick="location.reload()">Повторить</button>'); return; }
  if (!s.ok) {
    if (s.reason === 'denied') { try { localStorage.removeItem(LS_KEY); localStorage.removeItem('sk-crm-user-v1'); localStorage.removeItem('sk-crm-key-v1'); } catch (e) {} }
    if (s.reason === 'denied') gate('Ссылка не работает', 'Эта ссылка отключена или неверная. Попроси у Ильи новую.');
    else gate('Не получилось войти', 'Обнови страницу. (' + esc(s.reason || '') + ')');
    return;
  }
  const wasShown = !!(cachedUser && S.data);
  S.user = s.user;
  try { localStorage.setItem('sk-crm-user-v1', JSON.stringify(s.user)); } catch (e) {}
  if (wasShown) { render(); return; }
  try { const c = localStorage.getItem(LS_KEY); if (c) setData(JSON.parse(c)); } catch (e) {}
  render();
  load(false);
}
start();
